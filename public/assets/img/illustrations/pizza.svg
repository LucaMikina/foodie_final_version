<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="crust" cx="50%" cy="50%" r="50%">
      <stop offset="76%" stop-color="#F0C36B"/>
      <stop offset="92%" stop-color="#D9A24A"/>
      <stop offset="100%" stop-color="#C08935"/>
    </radialGradient>
    <radialGradient id="cheese" cx="45%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#FDF0B8"/>
      <stop offset="100%" stop-color="#F5D26E"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="200" cy="200" r="190" fill="url(#crust)" filter="url(#softShadow)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="#B5762A" stroke-width="2" opacity="0.4"/>
  <circle cx="200" cy="200" r="166" fill="url(#cheese)"/>

  <!-- tekstura sira (mjehurići) -->
  <g fill="#EFC252" opacity="0.5">
    <circle cx="150" cy="140" r="14"/>
    <circle cx="260" cy="120" r="10"/>
    <circle cx="270" cy="240" r="16"/>
    <circle cx="140" cy="260" r="11"/>
    <circle cx="200" cy="190" r="9"/>
    <circle cx="230" cy="290" r="8"/>
    <circle cx="110" cy="180" r="7"/>
  </g>

  <!-- rukola/bosiljak listovi -->
  <g fill="#5C7A32">
    <ellipse cx="185" cy="165" rx="12" ry="7" transform="rotate(30 185 165)"/>
    <ellipse cx="255" cy="255" rx="11" ry="6" transform="rotate(-20 255 255)"/>
    <ellipse cx="130" cy="215" rx="10" ry="6" transform="rotate(60 130 215)"/>
  </g>

  <!-- peperoni -->
  <g filter="url(#softShadow)">
    <circle cx="150" cy="150" r="27" fill="#E62D15"/>
    <circle cx="245" cy="150" r="27" fill="#E62D15"/>
    <circle cx="197" cy="225" r="27" fill="#E62D15"/>
    <circle cx="115" cy="235" r="23" fill="#E62D15"/>
    <circle cx="278" cy="220" r="23" fill="#E62D15"/>
  </g>
  <g fill="#B5220E" opacity="0.55">
    <circle cx="145" cy="145" r="3"/>
    <circle cx="157" cy="156" r="2.5"/>
    <circle cx="240" cy="146" r="3"/>
    <circle cx="252" cy="155" r="2.5"/>
    <circle cx="192" cy="220" r="3"/>
    <circle cx="204" cy="230" r="2.5"/>
    <circle cx="111" cy="230" r="2.5"/>
    <circle cx="273" cy="216" r="2.5"/>
  </g>
  <g fill="#F0714F" opacity="0.6">
    <circle cx="142" cy="141" r="6"/>
    <circle cx="238" cy="141" r="6"/>
    <circle cx="190" cy="216" r="6"/>
  </g>

  <!-- origano -->
  <g fill="#5C6B2E" opacity="0.8">
    <circle cx="175" cy="185" r="3"/>
    <circle cx="220" cy="170" r="2.5"/>
    <circle cx="230" cy="260" r="3"/>
    <circle cx="160" cy="210" r="2.5"/>
    <circle cx="255" cy="190" r="2"/>
    <circle cx="135" cy="190" r="2.5"/>
    <circle cx="290" cy="250" r="2"/>
  </g>

  <!-- rezovi kriski -->
  <g stroke="#E3B65C" stroke-width="2" opacity="0.5">
    <line x1="200" y1="34" x2="200" y2="366"/>
    <line x1="34" y1="200" x2="366" y2="200"/>
    <line x1="84" y1="84" x2="316" y2="316"/>
    <line x1="316" y1="84" x2="84" y2="316"/>
  </g>
</svg>
